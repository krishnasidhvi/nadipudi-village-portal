name: Refresh live data (mandi prices, river level, alerts)

on:
  schedule:
    # 02:30 UTC (8:00 AM IST) and 12:30 UTC (6:00 PM IST)
    - cron: '30 2,12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # commit the refreshed JSON
  actions: write  # start the deploy workflow afterwards

jobs:
  update-data:
    # data.gov.in and the CWC flood forecast site refuse connections from
    # GitHub's own servers, so this runs on a self-hosted runner in India
    # (a Windows PC with the label "india"). If that PC is off, the job waits
    # in the queue and runs when it comes back online (up to 24 hours).
    runs-on: [self-hosted, india]
    timeout-minutes: 15
    defaults:
      run:
        # On this PC "bash" is WSL, so use Windows PowerShell.
        shell: powershell
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Node.js 22 is installed on the runner PC.
      - name: Show Node.js version
        run: node --version

      # Fetches Agmarknet prices, the CWC Godavari level and NDMA alerts into
      # src/data/live/. A source that fails keeps its previous file, and the
      # site then marks that reading as out of date.
      - name: Fetch live data
        env:
          # Optional: free personal key from data.gov.in. Without it the script
          # uses the public sample key, which is rate-limited and often refused.
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: node scripts/fetchLiveData.js

      - name: Commit and deploy if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repository-local identity only: never touch the PC owner's global git config.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/live
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No data changes."
            exit 0
          }
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")
          git commit -m "Refresh live data [$stamp UTC]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A push made with the workflow token does not trigger other
          # workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
          if ($LASTEXITCODE -ne 0) { exit 1 }

name: Daily Automated Data Refresh for Nadipudi Portal

on:
  schedule:
    # Runs every morning at 04:00 UTC (9:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Daily Data Refresh Script
        run: node scripts/updateDailyData.js

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/agriData.js
          if ! git diff --staged --quiet; then
            git commit -m "Automated Daily Data Refresh for Nadipudi Portal [$(date +'%Y-%m-%d')]"
            git push origin main
          else
            echo "No data changes detected today."
          fi
